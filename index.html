<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WIP Qualité</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--line:#dfe5ee;--txt:#18212f;--muted:#667085;--acc:#5b5bd6}
*{box-sizing:border-box}body{margin:0;font:14px Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--txt)}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:20px;margin:0;margin-right:auto}.btn,select,input,textarea{font:inherit}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 11px;font-weight:600;cursor:pointer}.btn.primary{background:var(--acc);color:#fff;border-color:var(--acc)}.btn:disabled{opacity:.45;cursor:not-allowed}
main{padding:14px;max-width:1800px;margin:auto}.setup{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}.setup p{color:var(--muted);margin:6px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.status{padding:7px 9px;border-radius:999px;background:#f2f4f7;font-size:12px}.ok{color:#067647}.warn{color:#b54708}.err{color:#b42318}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;cursor:pointer}.tab.active{background:#eef0ff;border-color:#b9bbff;color:#3636a7;font-weight:700}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.filters input,.filters select{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px}
.board{display:grid;grid-template-columns:repeat(5,minmax(240px,1fr));gap:10px;overflow-x:auto}.col{border:1px solid var(--line);border-radius:12px;padding:9px;min-height:430px}.col[data-s=todo]{background:#eef4ff}.col[data-s=doing]{background:#fff7df}.col[data-s=review]{background:#f6efff}.col[data-s=blocked]{background:#fff0f0}.col[data-s=done]{background:#eef9f2}.head{font-weight:800;margin-bottom:8px;display:flex;justify-content:space-between}.cards{display:flex;flex-direction:column;gap:8px;min-height:350px}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px}.title{font-weight:750;margin-bottom:7px}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}.chip{background:#f2f4f7;border-radius:999px;padding:3px 6px;font-size:11px}.shared{background:#eef0ff;color:#3636a7}.late{background:#fee4e2;color:#b42318}.meta{font-size:12px;color:var(--muted);line-height:1.45}.quick{width:100%;margin-top:8px;border:1px solid var(--line);border-radius:7px;padding:6px;background:#fff}.edit{margin-top:7px;width:100%}
dialog{border:0;border-radius:14px;padding:0;max-width:650px;width:calc(100% - 24px);box-shadow:0 20px 60px #0004}dialog::backdrop{background:#10182866}.modal{padding:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}.modal input[type=text],.modal input[type=date],.modal select,.modal textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px}.checks{display:flex;gap:12px;flex-wrap:wrap}.checks label{font-weight:500}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.danger{color:#b42318}
@media(max-width:800px){.board{grid-template-columns:repeat(5,270px)}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<header>
<h1>WIP Qualité</h1>
<span id="sync" class="status">Non connecté</span>
<button id="connect" class="btn">📁 Connecter le dossier</button>
<button id="refresh" class="btn" disabled>↻ Actualiser</button>
<button id="add" class="btn primary" disabled>+ Nouvelle action</button>
</header>
<main>
<section id="setup" class="setup">
<strong>Test SharePoint / OneDrive sans serveur</strong>
<p>Choisis ton rôle, puis sélectionne le dossier SharePoint synchronisé sur ton PC. L'application créera automatiquement 3 fichiers JSON techniques.</p>
<div class="row">
<select id="role">
<option value="">— Mon rôle —</option>
<option value="assistante">Assistante qualité</option>
<option value="alternante">Alternante qualité</option>
<option value="responsable">Responsable qualité</option>
</select>
<span id="compat"></span>
</div>
</section>

<div id="tabs" class="tabs"></div>
<div class="filters">
<input id="search" placeholder="Rechercher…">
<select id="typeFilter"><option value="">Tous types</option><option value="ponctuelle">Ponctuelle</option><option value="recurrente">Récurrente</option><option value="fond">Mission de fond</option></select>
<select id="prioFilter"><option value="">Toutes priorités</option><option value="haute">Haute</option><option value="normale">Normale</option><option value="basse">Basse</option></select>
<label style="display:flex;align-items:center;gap:6px;font-weight:500"><input type="checkbox" id="hideDone"> Masquer terminé</label>
<button id="export" class="btn" disabled>Exporter sauvegarde</button>
</div>
<div id="board" class="board"></div>
</main>

<dialog id="dlg">
<form id="form" class="modal">
<h2 id="formTitle">Nouvelle action</h2>
<input type="hidden" id="id">
<div class="grid">
<div class="full"><label>Mission *</label><input id="title" type="text" required maxlength="180"></div>
<div><label>Catégorie</label><input id="category" type="text" placeholder="Audit, indicateurs, documentaire…"></div>
<div><label>Type</label><select id="type"><option value="ponctuelle">Ponctuelle</option><option value="recurrente">Récurrente</option><option value="fond">Mission de fond</option></select></div>
<div><label>Statut</label><select id="status"><option value="todo">À faire</option><option value="doing">En cours</option><option value="review">À valider</option><option value="blocked">Bloqué / En attente</option><option value="done">Terminé</option></select></div>
<div><label>Priorité</label><select id="priority"><option value="normale">Normale</option><option value="haute">Haute</option><option value="basse">Basse</option></select></div>
<div><label>Échéance</label><input id="due" type="date"></div>
<div><label>Récurrence</label><select id="recurrence"><option value="none">Aucune</option><option value="monthly">Mensuelle</option><option value="quarterly">Trimestrielle</option><option value="yearly">Annuelle</option></select></div>
<div class="full"><label>Affectation *</label><div class="checks">
<label><input type="checkbox" name="assignee" value="assistante"> Assistante</label>
<label><input type="checkbox" name="assignee" value="alternante"> Alternante</label>
<label><input type="checkbox" name="assignee" value="responsable"> Responsable</label>
</div></div>
<div class="full"><label>Notes</label><textarea id="notes" rows="4"></textarea></div>
</div>
<div class="actions">
<button type="button" id="del" class="btn danger" style="display:none;margin-right:auto">Supprimer</button>
<button type="button" id="cancel" class="btn">Annuler</button>
<button class="btn primary">Enregistrer</button>
</div>
</form>
</dialog>

<script>
(()=>{
"use strict";
const R={assistante:"Assistante",alternante:"Alternante",responsable:"Responsable"};
const F={assistante:"journal-assistante.json",alternante:"journal-alternante.json",responsable:"journal-responsable.json"};
const S=[["todo","À faire"],["doing","En cours"],["review","À valider"],["blocked","Bloqué / En attente"],["done","Terminé"]];
const V=[["all","Général"],["mine","Mes tâches"],["solo","Mes solo"],["sharedMine","Mes partagées"],["assistante","Assistante"],["alternante","Alternante"],["responsable","Responsable"],["team","Équipe"]];
let dir=null,tasks=new Map(),view="all",timer=null,busy=false;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const role=()=>localStorage.getItem("wipq_role")||"";
const setSync=(t,c="")=>{$("#sync").textContent=t;$("#sync").className="status "+c};
const now=()=>new Date().toISOString();
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random();
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function compat(){const ok=window.isSecureContext&&"showDirectoryPicker"in window;$("#compat").textContent=ok?"✓ Edge/Chrome compatible":"⚠ Ouvre via HTTPS (GitHub Pages) dans Edge/Chrome";$("#compat").className=ok?"ok":"warn"}
function openDb(){return new Promise((res,rej)=>{let r=indexedDB.open("wipq",1);r.onupgradeneeded=()=>r.result.createObjectStore("h");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function saveHandle(h){let d=await openDb();await new Promise((res,rej)=>{let t=d.transaction("h","readwrite");t.objectStore("h").put(h,"folder");t.oncomplete=res;t.onerror=()=>rej(t.error)});d.close()}
async function loadHandle(){let d=await openDb();let h=await new Promise((res,rej)=>{let t=d.transaction("h");let r=t.objectStore("h").get("folder");r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)});d.close();return h}
async function permission(h,ask=false){let o={mode:"readwrite"};if(await h.queryPermission(o)==="granted")return true;return ask&&(await h.requestPermission(o)==="granted")}
async function journal(k){try{let h=await dir.getFileHandle(F[k],{create:true}),f=await h.getFile(),x=await f.text();if(!x.trim())return{version:1,role:k,events:[]};let j=JSON.parse(x);return Array.isArray(j.events)?j:{version:1,role:k,events:[]}}catch(e){console.error(e);return{version:1,role:k,events:[]}}}
async function write(k,j){let h=await dir.getFileHandle(F[k],{create:true}),w=await h.createWritable();await w.write(JSON.stringify(j,null,2));await w.close()}
async function append(ev){let k=role();if(!k)throw Error("Rôle manquant");let j=await journal(k);j.events.push(ev);if(j.events.length>10000)j.events=j.events.slice(-10000);await write(k,j)}
function wins(a,b){if(!a)return true;let x=Date.parse(a.updatedAt)||0,y=Date.parse(b.updatedAt)||0;return y>x||(y===x&&String(b.eventId)>String(a.eventId))}
async function load(show=false){if(!dir||busy)return;busy=true;setSync("Synchronisation…","warn");try{if(!await permission(dir)){setSync("Autorisation requise","warn");return}let js=await Promise.all(Object.keys(R).map(journal)),last=new Map();js.flatMap(j=>j.events).forEach(e=>{if(wins(last.get(e.taskId),e))last.set(e.taskId,e)});tasks=new Map();last.forEach((e,id)=>{if(e.op!=="delete"&&e.task)tasks.set(id,e.task)});render();setSync("À jour "+new Date().toLocaleTimeString("fr-FR"),"ok")}catch(e){console.error(e);setSync("Erreur","err")}finally{busy=false}}
async function connect(){if(!role()){alert("Choisis d'abord ton rôle.");return}if(!window.isSecureContext||!("showDirectoryPicker"in window)){compat();return}try{dir=await window.showDirectoryPicker({mode:"readwrite"});if(!await permission(dir,true))return;await saveHandle(dir);for(let k of Object.keys(R)){let j=await journal(k);await write(k,j)};connected();await load();start()}catch(e){if(e.name!=="AbortError")console.error(e)}}
function connected(){$("#refresh").disabled=false;$("#add").disabled=false;$("#export").disabled=false;$("#setup").style.display="none";$("#connect").textContent="📁 Changer de dossier"}
function start(){clearInterval(timer);timer=setInterval(load,5000)}
async function resume(){try{let h=await loadHandle();if(!h)return;dir=h;if(await permission(h)){connected();await load();start()}else setSync("Reconnecter le dossier","warn")}catch(e){}}
function renderTabs(){let p=$("#tabs");p.innerHTML="";V.forEach(([id,l])=>{let b=document.createElement("button");b.className="tab"+(view===id?" active":"");b.textContent=l;b.onclick=()=>{view=id;renderTabs();render()};p.appendChild(b)})}
function inView(t){let a=t.assignees||[],r=role();if(view==="all")return true;if(view==="mine")return a.includes(r);if(view==="solo")return a.length===1&&a.includes(r);if(view==="sharedMine")return a.length>1&&a.includes(r);if(view==="team")return a.length>1;if(R[view])return a.includes(view);return true}
function list(){let q=$("#search").value.toLowerCase(),tf=$("#typeFilter").value,pf=$("#prioFilter").value,hd=$("#hideDone").checked;return[...tasks.values()].filter(t=>inView(t)&&(!tf||t.type===tf)&&(!pf||t.priority===pf)&&(!hd||t.status!=="done")&&(!q||(`${t.title} ${t.category||""} ${t.notes||""}`).toLowerCase().includes(q)))}
const typeLabel=v=>({ponctuelle:"Ponctuelle",recurrente:"Récurrente",fond:"Mission de fond"})[v]||v;
const recLabel=v=>({monthly:"Mensuelle",quarterly:"Trimestrielle",yearly:"Annuelle"})[v]||"";
function late(t){return t.due&&t.status!=="done"&&t.due<new Date().toISOString().slice(0,10)}
function render(){let l=list(),b=$("#board");b.innerHTML="";S.forEach(([s,name])=>{let c=document.createElement("section");c.className="col";c.dataset.s=s;let a=l.filter(t=>t.status===s).sort((x,y)=>(x.due||"9999").localeCompare(y.due||"9999"));c.innerHTML=`<div class="head"><span>${name}</span><span>${a.length}</span></div><div class="cards"></div>`;let cards=c.querySelector(".cards");a.forEach(t=>cards.appendChild(card(t)));cards.ondragover=e=>e.preventDefault();cards.ondrop=e=>{e.preventDefault();let id=e.dataTransfer.getData("text/plain");if(id)changeStatus(id,s)};b.appendChild(c)})}
function card(t){let e=document.createElement("article");e.className="card";e.draggable=true;e.ondragstart=x=>x.dataTransfer.setData("text/plain",t.id);let ppl=(t.assignees||[]).map(x=>R[x]).join(" + ");e.innerHTML=`<div class="title">${esc(t.title)}</div><div class="chips"><span class="chip">${esc(typeLabel(t.type))}</span>${t.assignees?.length>1?'<span class="chip shared">🤝 Partagée</span>':''}${late(t)?'<span class="chip late">En retard</span>':''}${t.recurrence!=="none"?`<span class="chip">↻ ${recLabel(t.recurrence)}</span>`:""}</div><div class="meta">${esc(ppl)}${t.due?`<br>📅 ${esc(t.due)}`:""}${t.category?`<br>${esc(t.category)}`:""}</div><select class="quick">${S.map(([v,l])=>`<option value="${v}" ${v===t.status?"selected":""}>${l}</option>`).join("")}</select><button class="btn edit">Modifier</button>`;e.querySelector(".quick").onchange=x=>changeStatus(t.id,x.target.value);e.querySelector(".edit").onclick=()=>edit(t);return e}
async function save(t){t.updatedAt=now();await append({eventId:uid(),taskId:t.id,op:"upsert",updatedAt:t.updatedAt,actor:role(),task:t});await nextOccurrence(t);await load()}
async function changeStatus(id,s){let t=tasks.get(id);if(t)await save({...t,status:s})}
function addMonths(d,n){if(!d)return"";let[a,b,c]=d.split("-").map(Number),x=new Date(Date.UTC(a,b-1,c));x.setUTCMonth(x.getUTCMonth()+n);return x.toISOString().slice(0,10)}
function addYears(d,n){if(!d)return"";let[a,b,c]=d.split("-").map(Number);return new Date(Date.UTC(a+n,b-1,c)).toISOString().slice(0,10)}
async function nextOccurrence(t){if(t.status!=="done"||t.recurrence==="none"||!t.due)return;let nd=t.recurrence==="monthly"?addMonths(t.due,1):t.recurrence==="quarterly"?addMonths(t.due,3):addYears(t.due,1),root=t.recurrenceRoot||t.id,nid=root+"::"+nd;if(tasks.has(nid))return;let n={...t,id:nid,status:"todo",due:nd,recurrenceRoot:root,createdAt:now(),updatedAt:now()};await append({eventId:uid(),taskId:nid,op:"upsert",updatedAt:n.updatedAt,actor:role(),task:n})}
function fresh(){ $("#form").reset();$("#id").value="";$("#formTitle").textContent="Nouvelle action";$("#del").style.display="none";$("#type").value="ponctuelle";$("#status").value="todo";$("#priority").value="normale";$("#recurrence").value="none";let r=role();if(r)$(`input[name=assignee][value=${r}]`).checked=true;$("#dlg").showModal()}
function edit(t){$("#id").value=t.id;$("#title").value=t.title||"";$("#category").value=t.category||"";$("#type").value=t.type;$("#status").value=t.status;$("#priority").value=t.priority||"normale";$("#due").value=t.due||"";$("#recurrence").value=t.recurrence||"none";$("#notes").value=t.notes||"";$$("input[name=assignee]").forEach(x=>x.checked=(t.assignees||[]).includes(x.value));$("#formTitle").textContent="Modifier l'action";$("#del").style.display="block";$("#dlg").showModal()}
$("#form").onsubmit=async e=>{e.preventDefault();let a=$$("input[name=assignee]:checked").map(x=>x.value);if(!a.length){alert("Affecte au moins une personne.");return}let id=$("#id").value||uid(),old=tasks.get(id)||{},t={...old,id,title:$("#title").value.trim(),category:$("#category").value.trim(),type:$("#type").value,status:$("#status").value,priority:$("#priority").value,due:$("#due").value,recurrence:$("#recurrence").value,assignees:a,notes:$("#notes").value.trim(),createdAt:old.createdAt||now()};$("#dlg").close();await save(t)}
$("#del").onclick=async()=>{let id=$("#id").value;if(id&&confirm("Supprimer cette action ?")){$("#dlg").close();await append({eventId:uid(),taskId:id,op:"delete",updatedAt:now(),actor:role()});await load()}}
$("#cancel").onclick=()=>$("#dlg").close();
$("#role").value=role();$("#role").onchange=e=>{localStorage.setItem("wipq_role",e.target.value);renderTabs();render()};
$("#connect").onclick=connect;$("#refresh").onclick=()=>load();$("#add").onclick=fresh;
["search","typeFilter","prioFilter","hideDone"].forEach(id=>$("#"+id).addEventListener(id==="search"?"input":"change",render));
$("#export").onclick=()=>{let blob=new Blob([JSON.stringify({exportedAt:now(),tasks:[...tasks.values()]},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="wip-qualite-backup-"+new Date().toISOString().slice(0,10)+".json";a.click()};
compat();renderTabs();render();resume();
})();
</script>
</body>
</html>
